name: 🔄 Sync LeetCode Solutions

on:
  schedule:
    - cron: "30 18 * * *"  # Runs daily at 12:00 AM IST (6:30 PM UTC)
  workflow_dispatch:        # Manual trigger from Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    name: Fetch & Commit Solutions

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install Dependencies
        run: pip install requests

      - name: ⚡ Sync LeetCode Solutions
        env:
          LEETCODE_SESSION:    ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_CSRF_TOKEN: ${{ secrets.LEETCODE_CSRF_TOKEN }}
        run: python sync.py

      - name: 📤 Commit & Push Changes
        run: |
          # ✅ Use YOUR GitHub email so commits count toward your streak
          git config user.name  "Rakshit0229"
          git config user.email "rakshitmishra029@gmail.com"
          git add .
          # Always commits — even if no new solutions (README timestamp updates daily)
          git diff --staged --quiet && git diff --quiet || \
          git commit -m "🤖 LeetCode Sync — $(date +'%Y-%m-%d %H:%M IST')" && \
          git push || echo "Nothing to commit today."
